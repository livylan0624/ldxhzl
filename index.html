  <div class="panel" data-page-node-id="VZXLe2CFb2HK1KlGl4Hs8h">

    <div class="card best" data-page-node-id="NWpP6OTrjlGVOoLUuCdzpQ"><div class="label" data-page-node-id="7zVYlWCSsGOy9miPo7sgO0">🏆 历史最高</div><div class="value" id="best" data-page-node-id="saYvafLfZ94GwS9zUgIq3d">0</div></div>
    <div class="card" data-page-node-id="zh4Arz8iZ6hsygyNSIIEjM"><div class="label" data-page-node-id="B5nUSnvGfSQQOamBToQOh3">当前速度</div><div class="value" id="speed" data-page-node-id="QgyHClxFljFbrKDdFrcC35">1</div></div>

      <p data-page-node-id="0GTTT3hKMgaFf9Tc7jX83J">方向键 / WASD 控制移动<br data-page-node-id="Kd12ow47DhENxSMDpD7Hed">手机上可以直接滑动屏幕</p>

<script>
(function () {
  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var GRID = 21;                 // 格子数
  var CELL = canvas.width / GRID;
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var speedEl = document.getElementById('speed');
  var startOverlay = document.getElementById('startOverlay');
  var overOverlay = document.getElementById('overOverlay');
  var startBtn = document.getElementById('startBtn');
  var retryBtn = document.getElementById('retryBtn');

  var snake, dir, nextDir, food, score, best, timer, speed, running, paused;

  best = parseInt(localStorage.getItem('snake_best') || '0', 10);
  bestEl.textContent = best;

  function reset() {
    snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
    dir = {x: 1, y: 0};
    nextDir = dir;
    score = 0;
    speed = 1;
    scoreEl.textContent = '0';
    speedEl.textContent = '1';
    placeFood();
  }

  function placeFood() {
    do {
      food = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
    } while (snake.some(function (s) { return s.x === food.x && s.y === food.y; }));
  }

  function interval() { return Math.max(70, 180 - (speed - 1) * 14); }

  function step() {
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 撞墙或撞自己
    var hitWall = head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID;
    var hitSelf = snake.some(function (s) { return s.x === head.x && s.y === head.y; });
    if (hitWall || hitSelf) { gameOver(); return; }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      var newSpeed = Math.floor(score / 50) + 1;
      if (newSpeed !== speed) { speed = newSpeed; speedEl.textContent = speed; restartTimer(); }
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function restartTimer() {
    if (timer) clearInterval(timer);
    timer = setInterval(step, interval());
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    // 棋盘背景
    ctx.fillStyle = 'rgba(15, 32, 39, 0.95)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 网格微光
    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    for (var i = 1; i < GRID; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }

    // 食物（发光苹果）
    ctx.save();
    ctx.shadowColor = '#f87171';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#f87171';
    roundRect(food.x * CELL + 3, food.y * CELL + 3, CELL - 6, CELL - 6, 7);
    ctx.fill();
    ctx.restore();

    // 蛇身（渐变：头亮尾暗）
    for (var j = snake.length - 1; j >= 0; j--) {
      var s = snake[j];
      var t = snake.length > 1 ? j / (snake.length - 1) : 0;
      var r = Math.round(74 + (34 - 74) * t);
      var g = Math.round(222 + (197 - 222) * t);
      var b = Math.round(128 + (94 - 128) * t);
      ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
      roundRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4, j === 0 ? 8 : 5);
      ctx.fill();
    }

    // 蛇眼睛
    var h = snake[0];
    ctx.fillStyle = '#06251a';
    var ex = h.x * CELL + CELL / 2, ey = h.y * CELL + CELL / 2;
    var off = CELL * 0.18;
    ctx.beginPath(); ctx.arc(ex + dir.x * off - dir.y * off, ey + dir.y * off - dir.x * off, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex + dir.x * off + dir.y * off, ey + dir.y * off + dir.x * off, 2.2, 0, Math.PI * 2); ctx.fill();
  }

  function gameOver() {
    running = false;
    clearInterval(timer);
    if (score > best) {
      best = score;
      localStorage.setItem('snake_best', best);
      bestEl.textContent = best;
      document.getElementById('overTitle').textContent = '🎉 新纪录！';
    } else {
      document.getElementById('overTitle').textContent = '游戏结束';
    }
    document.getElementById('overText').innerHTML = '本局得分：<b style="color:#4ade80;font-size:20px">' + score + '</b><br>长度：' + snake.length + ' 节';
    overOverlay.style.display = 'flex';
  }

  function start() {
    reset();
    running = true;
    paused = false;
    startOverlay.style.display = 'none';
    overOverlay.style.display = 'none';
    draw();
    restartTimer();
  }

  startBtn.addEventListener('click', start);
  retryBtn.addEventListener('click', start);

  function setDir(x, y) {
    // 不允许 180 度掉头
    if (dir.x === -x && dir.y === -y) return;
    nextDir = { x: x, y: y };
  }

  var keyMap = {
    ArrowUp: [0, -1], KeyW: [0, -1],
    ArrowDown: [0, 1], KeyS: [0, 1],
    ArrowLeft: [-1, 0], KeyA: [-1, 0],
    ArrowRight: [1, 0], KeyD: [1, 0]
  };

  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && running) {
      paused = !paused;
      if (paused) { clearInterval(timer); }
      else { restartTimer(); }
      e.preventDefault();
      return;
    }
    var m = keyMap[e.code];
    if (m) { setDir(m[0], m[1]); e.preventDefault(); }
  });

  // 屏幕按钮
  Array.prototype.forEach.call(document.querySelectorAll('.controls button'), function (btn) {
    btn.addEventListener('click', function () {
      var d = btn.getAttribute('data-dir');
      if (d === 'up') setDir(0, -1);
      if (d === 'down') setDir(0, 1);
      if (d === 'left') setDir(-1, 0);
      if (d === 'right') setDir(1, 0);
    });
  });

  // 触屏滑动
  var tx = 0, ty = 0;
  canvas.addEventListener('touchstart', function (e) {
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive: true });
  canvas.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  // 初始画面
  reset();
  draw();
})();
</script>
</body>
