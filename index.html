<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="wDfkDw2tqJGghewu7Gd6K4">
<head data-page-node-id="dSWkdxbTomnJ01bZ9arFm5">
  <meta charset="UTF-8" data-page-node-id="dqCRgrIEYSJGHCoIKLcwpQ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="tSEpXD6kW3x3W3phPoCNby">
  <title>课表聚合器 - 课程与任务时间轴</title>
  <meta name="description" content="把散落在教务系统、学习通、微信群、邮件里的课程与任务，聚合到一条统一的时间轴" data-page-node-id="2AWEr65SZLDhTPEKUfvVtB">
  <link rel="stylesheet" href="css/style.css" data-page-node-id="AZAFkmMlgGSW32hx3U5ETa">
</head>
<body data-page-node-id="OcFbtH16K4dHV8p3Ia8zhK">
  <!-- 顶部标题与学期设置 -->
  <header data-page-node-id="HOT833USh0kFRClZixHZN5">
    <h1 data-page-node-id="7AQc4uU9TjyQAaLZEXduGj">课表聚合器</h1>
    <p class="subtitle" data-page-node-id="g88VvQ9KiLZwi1nhH68bQw">课程 · 任务 · 一条时间轴</p>
    <div class="semester" data-page-node-id="iXC01zKaec2H74eYhEAJQ6">
      <label for="semesterStart" data-page-node-id="EyNiD9c0AGcTcH5FxUrJzF">学期第 1 周的周一</label>
      <input type="date" id="semesterStart" data-page-node-id="z0jSf0LeouU9XCn8ONyDUW">
      <span class="week-now" id="weekNow" data-page-node-id="BXqJ6WKO8hZXMC6T9Alkyx"></span>
    </div>
  </header>

  <!-- 今天 / 明天 切换 -->
  <nav class="tabs" data-page-node-id="MNngULLm7PH3UQaM34NAoC">
    <button class="tab active" data-day="0" data-page-node-id="szcWs8D2BGxuvJ7f6O47SY">今天</button>
    <button class="tab" data-day="1" data-page-node-id="ILHdWMPl9T3IiofmhgOkAt">明天</button>
  </nav>

  <!-- 当前日期信息 -->
  <div class="date-label" id="dateLabel" data-page-node-id="XC4rlFqrs5TYkIsPNfr9dp"></div>

  <!-- 时间轴主体 -->
  <main class="timeline" id="timeline" data-page-node-id="ahRCuhdQG9Hz9CEbDbuC4Y"></main>

  <!-- 添加按钮 -->
  <button class="add-btn" id="addBtn" data-page-node-id="YHFm2k5HDMpERk8fQbQEVG">+ 添加课程 / 任务</button>

  <!-- 添加弹窗 -->
  <div class="modal-mask" id="modalMask" hidden data-page-node-id="YhcGmFFzDUF08ZrHSJVD8l">
    <div class="modal" data-page-node-id="Y63SwEUIYpUNoe6jbZ7fZt">
      <div class="modal-tabs" data-page-node-id="wHKOLlOJvhdPPpl7dfkRtG">
        <button class="modal-tab active" data-form="course" data-page-node-id="XgNJE06vT0Lh2sclQvkHBC">添加课程</button>
        <button class="modal-tab" data-form="task" data-page-node-id="VXeS39TXJBtkfBJ4fiGs5C">添加任务</button>
      </div>

      <!-- 课程表单 -->
      <form id="courseForm" class="modal-form" data-page-node-id="a3TWwLpKo6I3KatEL7v4z9">
        <div class="row" data-page-node-id="GGeGIQWUJOJLHySJ4frIhx">
          <label data-page-node-id="CTZDtvIFhp24LGcbpJR4gv">课程名 *</label>
          <input name="name" placeholder="如：高等数学(下)" maxlength="50" required data-page-node-id="7tNv0ANPn9SvJdjnbzRqO6">
        </div>
        <div class="row two" data-page-node-id="NwnWtYRYeWCPamHvrlcIhc">
          <div data-page-node-id="z9ySpC8LGQISzWsPLfavD9">
            <label data-page-node-id="vMkKYJQj6nJKFeRP8iT4LA">教师</label>
            <input name="teacher" placeholder="选填" maxlength="20" data-page-node-id="6ldvpbNDjkpbQBJKNQdV7p">
          </div>
          <div data-page-node-id="hrOuCGc4H9mFpI94W62pl3">
            <label data-page-node-id="H2WvSnn9ROxOIz0yF2ct8Z">教室</label>
            <input name="classroom" placeholder="选填" maxlength="30" data-page-node-id="IYeu5g6aQcRyzDsfOlsygO">
          </div>
        </div>
        <div class="row" data-page-node-id="xgMX0I1uxY9fRNhtCaa3JD">
          <label data-page-node-id="xTuJV3O905YWOLDN1SoGaX">星期 *</label>
          <select name="weekday" id="weekdaySel" required data-page-node-id="AaZqaBXELMF4qduoeYuEVK"></select>
        </div>
        <div class="row two" data-page-node-id="VSbOvVLp0QRAIJwepPz6Ah">
          <div data-page-node-id="7cDnNWeM25hu7awM5XLAMY">
            <label data-page-node-id="C0c6kGXJO3HIy5FonbMir1">开始节次 *</label>
            <select name="startSection" id="startSectionSel" required data-page-node-id="WFIfzdvPM1NdAGk0FbxPFq"></select>
          </div>
          <div data-page-node-id="pIQq4LFMaJSbSBUO5geqio">
            <label data-page-node-id="qVSBPMGwu3CO8FxR8hcDrT">结束节次 *</label>
            <select name="endSection" id="endSectionSel" required data-page-node-id="EFMcul1ypReBPPaX10P1DK"></select>
          </div>
        </div>
        <div class="row two" data-page-node-id="zXtQQf3Y1JeRlCDz6CATk6">
          <div data-page-node-id="uEx79HHxRkvrdZHvwwqKMi">
            <label data-page-node-id="z42OE4gADyd96G8QpU6LMh">开始周次 *</label>
            <select name="weekStart" id="weekStartSel" required data-page-node-id="Kvu8LOmurfLBFiTlylP2ku"></select>
          </div>
          <div data-page-node-id="uIUsYBdwfjGwHhX8M6n5Xz">
            <label data-page-node-id="kuaUntRjN1a6nU8JrJWUB1">结束周次 *</label>
            <select name="weekEnd" id="weekEndSel" required data-page-node-id="N0E9LABiUt5Q4PQdoB0pcg"></select>
          </div>
        </div>
        <div class="row" data-page-node-id="brdPxntflCQenc9e5mS5Ly">
          <label data-page-node-id="JdIXFvzCErF4KJQvCsZbqw">重复方式 *</label>
          <select name="weekType" data-page-node-id="kZpFxFYnxlqQ0JCF3145AH">
            <option value="all" data-page-node-id="gEUhay5U2bNAQ7MEVDYU9P">每周</option>
            <option value="odd" data-page-node-id="C9KqOPNtuXOAIHkCPihiPE">单周</option>
            <option value="even" data-page-node-id="6Wz1GwDmJHpd7eqI0IjFqj">双周</option>
          </select>
        </div>
        <div class="form-actions" data-page-node-id="o6P0qF4v4kTEBGUgRRUFvi">
          <button type="button" class="btn-ghost" id="cancelBtn" data-page-node-id="7IOBaYlmY8ZKMTCgtTwiRv">取消</button>
          <button type="submit" class="btn-primary" data-page-node-id="KTNzjMX5pkLXyMySJNUfDn">保存课程</button>
        </div>
      </form>

      <!-- 任务表单 -->
      <form id="taskForm" class="modal-form" hidden data-page-node-id="cf4I6Iv2JyWTfHgrkl9Uhk">
        <div class="row" data-page-node-id="TTMBJ7QC7jURhQZksyh4K5">
          <label data-page-node-id="uGldKXUAsnhvDSt8fINZ8E">任务名 *</label>
          <input name="title" placeholder="如：交高数第三章作业" maxlength="100" required data-page-node-id="OgacEya9KcQy8BJXC8PzeC">
        </div>
        <div class="row" data-page-node-id="sCwps0F0sdjyoexszw3s0a">
          <label data-page-node-id="K9UPU1XiVEJt7CS0DnQYhz">所属课程</label>
          <select name="courseIndex" id="taskCourseSel" data-page-node-id="7RkmZCAxqgByMHqveJpGMc"></select>
        </div>
        <div class="row two" data-page-node-id="7nY3FKbzwtypB16dS8KL33">
          <div data-page-node-id="EuB0DdE9OFY37m9dqpPNe9">
            <label data-page-node-id="ifs9Z6s2ljtH1g5KCrRyOD">截止日期 *</label>
            <input type="date" name="deadlineDate" required data-page-node-id="P6uinQDwDYaEfeWMhti7DM">
          </div>
          <div data-page-node-id="bmAjr2MmH7OOWkpkzVBlBw">
            <label data-page-node-id="bFgvxAZOLAnyDkAFnPwfMd">截止时间 *</label>
            <input type="time" name="deadlineTime" value="23:59" required data-page-node-id="J8v7pYoBRFHBHFPO4ouJ8v">
          </div>
        </div>
        <div class="row" data-page-node-id="wEdA5CLUxivQv2Dy5Ad5ml">
          <label data-page-node-id="EeyKFZuKfCkGeBAh1d2aZE">来源 *</label>
          <select name="source" data-page-node-id="Y02n4EJNY23LN2S1aWxAEH">
            <option value="manual" data-page-node-id="jHQejttO3o255mLBbu0YT2">手动添加</option>
            <option value="xuexitong" data-page-node-id="qySBTt0nAdkjqq9OJwTWoM">学习通</option>
            <option value="email" data-page-node-id="gMNrtrsTaUWckUCMECel8H">邮件</option>
            <option value="group" data-page-node-id="cBhYMcccnDNt6yqYKkNCvR">微信群</option>
            <option value="jiaowu" data-page-node-id="5YBRmGrBUlHHWrEuPkiFGG">教务系统</option>
          </select>
        </div>
        <div class="row" data-page-node-id="0MlrxiMWBgAEFGelAouM8M">
          <label data-page-node-id="bRAECaWsythFwlKdXXSepX">备注</label>
          <input name="remark" placeholder="选填，作业要求等" maxlength="200" data-page-node-id="hLy9IJv8yXArJmGSpnLFIU">
        </div>
        <div class="form-actions" data-page-node-id="F0SAP6N7kzV7W32GtJIosV">
          <button type="button" class="btn-ghost" id="cancelBtn2" data-page-node-id="AuzArIIf4pDqi19mTSqM6r">取消</button>
          <button type="submit" class="btn-primary" data-page-node-id="LRxG5fy3IPZyz1xPlYAvI3">保存任务</button>
        </div>
      </form>
    </div>
  </div>

  <footer data-page-node-id="xGjYzWPF6kcFlUO3Zc7f4o">数据保存在本浏览器（localStorage），换设备需重新添加</footer>

  <script src="js/constants.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
